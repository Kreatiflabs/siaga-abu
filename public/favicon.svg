<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Ash Plume Gradient -->
    <linearGradient id="ashGrad" x1="32" y1="6" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7849" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="32" y1="28" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Magma Glow Gradient -->
    <linearGradient id="magmaGrad" x1="32" y1="26" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Volcanic Ash Cloud / Plume (Layered Modern Style) -->
  <g filter="url(#glow)">
    <!-- Main Center Ash Cloud -->
    <path d="M32 7C27 7 24 10 24 13C20 13 18 16 19 19C15 20 15 25 18 27C21 29 27 30 32 30C37 30 43 29 46 27C49 25 49 20 45 19C46 16 44 13 40 13C40 10 37 7 32 7Z" fill="url(#ashGrad)" />
    
    <!-- Top Plume Expansion -->
    <circle cx="32" cy="12" r="5" fill="#fef08a" opacity="0.4" />
    <circle cx="26" cy="18" r="4.5" fill="#ffedd5" opacity="0.3" />
    <circle cx="38" cy="18" r="4.5" fill="#ffedd5" opacity="0.3" />
  </g>

  <!-- Ejecta Sparks -->
  <circle cx="16" cy="12" r="1.5" fill="#f59e0b" />
  <circle cx="48" cy="11" r="1.5" fill="#f97316" />
  <circle cx="34" cy="5" r="1.2" fill="#fbbf24" />

  <!-- Mountain Silhouette -->
  <path d="M26 31L10 56C9.5 56.8 10 58 11 58H53C54 58 54.5 56.8 54 56L38 31H26Z" fill="url(#mountainGrad)" />

  <!-- Crater Rim Highlight -->
  <ellipse cx="32" cy="31" rx="6" ry="2" fill="#fbbf24" opacity="0.9" />

  <!-- Lava Flow / Fissure on Mountain Slopes -->
  <path d="M32 31L31 38L33 44L30 52" stroke="url(#magmaGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M28 33L25 40L23 48" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M36 33L39 41L41 49" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
